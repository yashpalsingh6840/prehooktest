[project]
name = "ssis-validator"
version = "0.1.0"
description = "Independent static validator for SSIS-to-C# rewrites"
requires-python = ">=3.11"
dependencies = [
    "sqlglot>=25.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
ssis_validator = "ssis_validator.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ssis_validator*"]
